[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisint"
version = "0.1.0"
description = "Enterprise-grade OSINT Aggregation, Case Management, and AI Entity-Resolution Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OmniSINT Contributors" }]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "networkx>=3.2.1",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "textual>=0.50.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
]

[project.scripts]
omnisint = "omnisint.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnisint*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
