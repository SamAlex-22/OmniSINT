[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisint"
version = "0.1.0"
description = "Open-source OSINT Aggregation, Cryptographic Case Custody, and Mathematical/AI Entity-Resolution Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OmniSINT Contributors" }]
dependencies = [
    "pydantic>=2.5.0",
    "cryptography>=42.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "flask>=3.0.0",
    "httpx>=0.26.0",
]
tui = [
    "rich>=13.7.0",
    "textual>=0.50.0",
    "typer>=0.9.0",
]
graph = [
    "networkx>=3.2.1",
]
full = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "flask>=3.0.0",
    "httpx>=0.26.0",
    "networkx>=3.2.1",
    "rich>=13.7.0",
    "textual>=0.50.0",
    "typer>=0.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
omnisint = "omnisint.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnisint*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
